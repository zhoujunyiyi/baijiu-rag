<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>白酒财报问答</title>
<style>
:root{color-scheme:light;--nav:#163b36;--paper:#f6f5ef;--text:#1d302b;--muted:#4c645a;--line:#d8e0d8;--accent:#116451}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--text);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
header{background:var(--nav);color:white}
.nav{max-width:1120px;margin:auto;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.nav strong{font-size:17px}.nav small{color:#d1e9df}
main{max-width:1120px;margin:auto;padding:35px 24px 60px}
.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}
h1{font-size:clamp(30px,4vw,45px);line-height:1.15;margin:0 0 9px;letter-spacing:-.035em}
p{margin:0}.hero p,.muted{color:var(--muted)}
.stats{display:flex;gap:20px;white-space:nowrap}.stats span{display:block;color:var(--muted);font-size:13px}.stats strong{font-size:23px;font-variant-numeric:tabular-nums}
section,aside,form{background:white;border:1px solid var(--line);border-radius:13px;padding:20px}
label,h2{font-weight:700;font-size:18px;margin:0 0 10px;display:block}
textarea{display:block;width:100%;padding:10px 13px;min-height:66px;resize:vertical;font:inherit;border:1px solid #9db3a8;border-radius:7px;color:var(--text)}
button{font:inherit;cursor:pointer;border-radius:7px}
button[type=submit]{background:var(--accent);color:white;border:0;padding:7px 17px;font-weight:650;white-space:nowrap}
button:disabled{opacity:.6}.quick{border:1px solid var(--line);background:#f4f8f5;color:#225449;font-size:13px;padding:5px 9px;text-align:left}
.actions,.suggestions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.actions{justify-content:space-between;margin-top:11px}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;margin-top:14px;align-items:start}
.answer{padding:9px 0;border-bottom:1px solid #edf0ed;overflow-wrap:anywhere}.answer:last-child{border-bottom:0}
.cite{font-size:13px;margin-left:6px;white-space:nowrap}
a{color:#0f6550;text-underline-offset:3px}.source{border-top:1px solid #e5ebe5;padding:10px 0;overflow-wrap:anywhere}.source small{display:block;color:var(--muted)}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f8f5;border-radius:6px;padding:8px 10px;font:13px/1.55 inherit;margin:8px 0 0;font-family:inherit;font-size:13px}
.source details{margin-top:5px;color:var(--muted);font-size:13px}
.table-wrap{overflow-x:auto;margin-top:6px;border:1px solid #e5ebe5;border-radius:5px}
table{border-collapse:collapse;width:100%;font-size:12px;line-height:1.4;text-align:left}
th,td{padding:6px 7px;vertical-align:top;border-right:1px solid #e5ebe5}
th{background:#eef5ef;font-weight:650}td{font-variant-numeric:tabular-nums}
details{margin-top:13px}summary{cursor:pointer;font-weight:650}h3{font-size:14px;margin:10px 0 5px}.badge{background:#e8f3ec;color:#205a49;padding:3px 7px;border-radius:5px;font-size:12px;margin-right:7px}
#status{font-size:13px;color:var(--muted);margin-top:8px} [hidden]{display:none!important}
@media(max-width:790px){.grid{grid-template-columns:1fr}.hero{align-items:start;flex-direction:column}.stats{white-space:normal}}
</style>
</head>
<body>
<header><div class="nav"><strong>白酒财报问答</strong><small>2024 年报全文 · 方向 A</small></div></header>
<main>
<div class="hero"><div><h1>查财报，看出处</h1><p>查询上市白酒公司的年报指标、经营情况和跨公司差异。</p></div><div id="stats" class="stats"></div></div>
<form id="question-form">
<label for="question">你想查什么？</label>
<textarea id="question" required maxlength="450" placeholder="例：贵州茅台、五粮液和山西汾酒的营业收入与归母净利润分别是多少？"></textarea>
<div class="actions"><div class="suggestions" id="suggestions"></div><button type="submit">检索并回答</button></div>
<p id="status" role="status" aria-live="polite"></p>
</form>
<div class="grid" id="result" hidden>
<section><h2>回答</h2><div id="answer"></div></section>
<aside><h2>答案出处</h2><div id="sources"></div><details><summary id="recall-label">查看召回块</summary><div id="recall"></div></details></aside>
</div>
</main>
<script>
const $ = id => document.getElementById(id);
const el = (tag, text, cls) => {
  const element = document.createElement(tag);
  if (text) element.textContent = text;
  if (cls) element.className = cls;
  return element;
};
const examples = [
  ["盈利与资本回报", "从规模、盈利和资本回报看，贵州茅台、五粮液、山西汾酒的营业收入、归母净利润、加权平均净资产收益率分别是多少？逐项排名。"],
  ["销售模式", "贵州茅台的销售模式有哪些？直销和批发代理分别包括哪些渠道？"],
  ["现金流与资产", "比较泸州老窖、洋河股份、古井贡酒的经营现金流量净额、总资产、基本每股收益，逐项给出数据和排名。"]
];
function sourceCard(ref, includeScore, expand = false) {
  const card = el("div", "", "source");
  card.append(el("span", ref.kind, "badge"));
  const link = el("a", ref.company + " · PDF 第 " + ref.page + " 页");
  link.href = ref.url;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  card.append(link, el("small", ref.section + " · " + ref.id));
  if (includeScore) card.append(el("small", "BM25 " + ref.bm25 + " · 向量 " + ref.cosine + " · 融合 " + ref.fused));
  const details = el("details");
  details.open = expand;
  details.append(el("summary", ref.kind === "表格" ? "查看表格行" : "查看原文摘录"));
  if (ref.kind === "表格") {
    const wrap = el("div", "", "table-wrap");
    const table = el("table");
    const head = table.createTHead().insertRow();
    const body = table.createTBody().insertRow();
    ref.headers.forEach((headValue, i) => {
      const heading = el("th", headValue || "列 " + (i + 1));
      heading.scope = "col";
      head.append(heading);
      body.append(el("td", ref.cells[i]));
    });
    wrap.append(table);
    details.append(wrap);
    if (ref.unit) details.append(el("small", "单位 " + ref.unit));
  } else {
    details.append(el("pre", ref.text));
  }
  card.append(details);
  return card;
}
async function ask(question) {
  $("status").textContent = "正在检索年报…";
  const button = document.querySelector("button[type=submit]");
  button.disabled = true;
  try {
    const response = await fetch("/api/ask", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({question})
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error);
    const items = Object.values(data.retrieval).flat();
    const refs = new Map(items.map(ref => [ref.id, ref]));
    $("answer").replaceChildren(...data.answer.map(text => {
      const match = text.match(/^(.*) \[([^\]]+)\]$/s);
      const row = el("div", match ? match[1] : text, "answer");
      if (match && refs.has(match[2])) {
        const ref = refs.get(match[2]);
        const link = el("a", "〔PDF 第 " + ref.page + " 页〕", "cite");
        link.href = ref.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        row.append(link);
      }
      return row;
    }));
    $("sources").replaceChildren(...data.evidence.map((id, index) => sourceCard(refs.get(id), false, index === 0)));
    if (!data.evidence.length) $("sources").append(el("p", "暂无可引用出处。", "muted"));
    $("recall-label").textContent = "查看召回块（" + items.length + " 条）";
    $("recall").replaceChildren();
    for (const [group, rows] of Object.entries(data.retrieval)) {
      $("recall").append(el("h3", group), ...rows.map(row => sourceCard(row, true)));
    }
    $("result").hidden = false;
    document.body.dataset.ready = "true";
    $("status").textContent = "检索完成 · 向量与 BM25 融合";
  } catch (error) {
    $("status").textContent = "查询失败：" + error.message;
  } finally {
    button.disabled = false;
  }
}
for (const [label, query] of examples) {
  const button = el("button", label, "quick");
  button.type = "button";
  button.addEventListener("click", () => {
    $("question").value = query;
    ask(query);
  });
  $("suggestions").append(button);
}
$("question-form").addEventListener("submit", event => {
  event.preventDefault();
  ask($("question").value.trim());
});
fetch("/api/corpus").then(response => response.json()).then(data => {
  for (const [key, label] of [["companies","家公司"],["pages","页财报"],["chunks","检索块"]]) {
    const box = el("div");
    box.append(el("strong", data[key].toLocaleString("zh-CN")), el("span", label));
    $("stats").append(box);
  }
});
</script>
</body>
</html>
